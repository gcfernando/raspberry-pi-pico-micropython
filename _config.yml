url: "https://gcfernando.github.io"
baseurl: "/raspberry-pi-pico-micropython"
title: "MicroPython & Pico Examples"
description: "A Raspberry Pi Pico 2 W MicroPython LED example, with source code and an explanation of GPIO and timing."
lang: en
plugins:
  - jekyll-sitemap
exclude:
  - .claude
  - .agents
  - .codex
  - packages
  - node_modules

# Public documentation navigation and presentation.
repository: gcfernando/raspberry-pi-pico-micropython
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Hardware & learning"
defaults:
  - scope:
      path: "README.md"
    values:
      title: "Raspberry Pi Pico 2 W — MicroPython LED Example"
      description: "Learn Raspberry Pi Pico 2 W GPIO and timing with a MicroPython LED blink example, firmware prerequisites, board-running instructions and verification steps."
  - scope:
      path: "PiPico2W/FirstLed/readme.md"
    values:
      title: "Blink the Pico 2 W LED with MicroPython"
      description: "Learn GPIO output and one-second timing with a short MicroPython onboard LED example for the Pico 2 W."
